version: "3.8"

services:
  portfolio-app:
    container_name: portfolio-app
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - tcs_proxy_network

networks:
  tcs_proxy_network:
    external: true
